<script>
const $ = s=>document.querySelector(s);
// ===== Windows二进制1024存储换算，簇4KB =====
function bytesToGB(bytes) {
  return bytes / (1024 * 1024 * 1024);
}
function gbToBytes(gb) {
  return gb * 1024 * 1024 * 1024;
}
const CLUSTER_SIZE = 4096; // Windows默认4KB簇
// 按簇向上取整，计算文件真实磁盘占用
function getFileDiskOccupiedSize(fileByteSize) {
  if(fileByteSize === 0) return CLUSTER_SIZE;
  const clusterCount = Math.ceil(fileByteSize / CLUSTER_SIZE);
  return clusterCount * CLUSTER_SIZE;
}
// C盘全局容量
const C_TOTAL_BYTES = gbToBytes(112);
let cFreeBytes = gbToBytes(15.1);
let sys = {
  powerOn:false,
  ramTotal:16,
  ramUsed:0,
  desktopItems:[],
  recycleBin:[],
  windows:[],
  nextWinZ:11,
  clipboard:null,
  clipboardOp:"",
  selectedIcons:[],
  currentExplorerFolder:null,
   fs:{
    quickAccess:[
      {name:"桌面",type:"quick"},
      {name:"下载",type:"quick"},
      {name:"文档",type:"quick"},
      {name:"图片",type:"quick"},
    ],
        drives:[
      {
        name:"BOOTCAMP (C:)",
        type:"disk",
        totalBytes:C_TOTAL_BYTES,
        freeBytes:cFreeBytes,
        expanded:false,
        children:[
          {name:"3D 对象",type:"folder",children:[]},
          {name:"视频",type:"folder",children:[]},
          {name:"图片",type:"folder",children:[]},
          {name:"文档",type:"folder",children:[]},
          {name:"下载",type:"folder",children:[]},
          {name:"音乐",type:"folder",children:[]},
          {name:"桌面",type:"folder",children:[]}
        ]
      }
    ],
    cloud:[
      {name:"WPS云盘",type:"cloud"},
      {name:"OneDrive",type:"cloud"}
    ]
  },
  wechatChats:[
    {name:"文件传输助手",msgList:[{who:"other",text:"你好，微信模拟器已就绪"}]},
    {name:"好友A",msgList:[{who:"other",text:"今天有空吗？"}]}
  ],
  qqChats:[
    {name:"我的设备",msgList:[{who:"other",text:"QQ模拟器启动成功"}]},
    {name:"班级群",msgList:[{who:"other",text:"作业记得提交"}]}
  ],
  wecomChats:[
    {name:"同事小张",msgList:[{who:"other",text:"下午开会"}]},
    {name:"公司大群",msgList:[{who:"other",text:"通知：本周五团建"}]}
  ],
  larkChats:[
    {name:"项目组",msgList:[{who:"other",text:"文档更新了，请查看"}]},
    {name:"行政",msgList:[{who:"other",text:"打卡提醒"}]}
  ],
  browserUrl:"https://example.com"
};
// 全部内置SVG图标，无外部图片
const svgIcons = {
pc:`<svg viewBox="0 0 48 48"><rect fill="#0078d4" rx="4" width="48" height="48" /><path fill="#fff" d="M12 16h24v16H12z M16 36h16v4H16z" /></svg>`,
recycleEmpty:`<svg viewBox="0 0 48 48"><rect fill="#4488dd" rx="6" width="48" height="48" /><path fill="#fff" d="M14 12h20v4H14zM16 18h16l-2 20H18z" /></svg>`,
recycleFull:`<svg viewBox="0 0 48 48"><rect fill="#4488dd" rx="6" width="48" height="48" /><path fill="#fff" d="M14 12h20v4H14zM16 18h16l-2 20H18z" /><circle cx="20" cy="26" r="4" fill="#2277dd" /><circle cx="28" cy="26" r="4" fill="#2277dd" /><circle cx="20" cy="34" r="4" fill="#2277dd" /></svg>`,
wechat:`<svg viewBox="0 0 48 48"><circle fill="#07c160" cx="24" cy="24" r="22" /><circle fill="#fff" cx="16" cy="18" r="3" /><circle fill="#fff" cx="32" cy="18" r="3" /><circle fill="#fff" cx="14" cy="30" r="3" /><circle fill="#fff" cx="34" cy="30" r="3" /></svg>`,
qq:`<svg viewBox="0 0 48 48"><circle fill="#12b7f5" cx="24" cy="24" r="22" /><ellipse fill="#fff" cx="24" cy="18" rx="12" ry="10" /><circle fill="#000" cx="18" cy="17" r="2" /><circle fill="#000" cx="30" cy="17" r="2" /><path fill="#ff6644" d="M14 26h20l-2 6H16z" /></svg>`,
wecom:`<svg viewBox="0 0 48 48"><rect fill="#eeeeee" rx="8" width="48" height="48" /><rect fill="#07c160" x="8" y="8" width="32" height="32" rx="6" /></svg>`,
lark:`<svg viewBox="0 0 48 48"><defs><linearGradient id="lk" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#7149ff" /><stop offset="100%" stop-color="#22b8cf" /></linearGradient></defs><rect fill="url(#lk)" rx="8" width="48" height="48" /><circle fill="#fff" cx="24" cy="24" r="12" /></svg>`,
browser:`<svg viewBox="0 0 48 48"><circle fill="#ffffff" cx="24" cy="24" r="22" /><circle stroke="#4285f4" stroke-width="3" cx="24" cy="24" r="16" /><circle fill="#4285f4" cx="24" cy="24" r="8" /></svg>`,
txt:`<svg viewBox="0 0 48 48"><rect fill="#1971c2" rx="4" width="48" height="48" /></svg>`,
folder:`<svg viewBox="0 0 48 48"><rect fill="#fd7e14" rx="4" width="48" height="48" /></svg>`
};
// 创建文件，占用磁盘
function createFileOnDisk(fileByteSize){
  const occupyBytes = getFileDiskOccupiedSize(fileByteSize);
  if(cFreeBytes >= occupyBytes){
    cFreeBytes -= occupyBytes;
    sys.fs.drives[0].freeBytes = cFreeBytes;
    refreshExplorer();
    return true;
  }else{
    alert("磁盘空间不足！");
    return false;
  }
}
// 删除文件，归还磁盘空间
function deleteFileFromDisk(fileByteSize){
  const occupyBytes = getFileDiskOccupiedSize(fileByteSize);
  cFreeBytes += occupyBytes;
  sys.fs.drives[0].freeBytes = cFreeBytes;
  refreshExplorer();
}
// 开机点击
$("#monitor").onclick = function(){
  if(!sys.powerOn){
    sys.powerOn=true;
    $("#win10").style.display="block";
    $("#monitor").classList.remove("screen-off");
    initDesktop();
    startClock();
    updateRAM();
    initBoxSelect();
  }
}
function shutdown(){
  sys.powerOn=false;
  $("#win10").style.display="none";
  $("#monitor").classList.add("screen-off");
  $("#startMenu").style.display="none";
}
function restart(){
  shutdown();
  setTimeout(()=>{
    sys.powerOn=true;
    $("#win10").style.display="block";
    $("#monitor").classList.remove("screen-off");
    initDesktop();
    updateRAM();
  },800)
}
function toggleStartMenu(){
  const sm = $("#startMenu");
  sm.style.display = sm.style.display==="block" ? "none":"block";
}
// 修复：点击页面空白关闭开始菜单
document.addEventListener("click",(e)=>{
  const sm = $("#startMenu");
  const btn = document.querySelector(".start-btn");
  if(sm.style.display==="block"){
    if(!sm.contains(e.target) && !btn.contains(e.target)){
      sm.style.display="none";
    }
  }
})

function startClock(){
  setInterval(()=>{
    const d = new Date();
    $("#clock").innerText = d.toLocaleTimeString();
  },1000)
}
function updateRAM(){
  sys.ramUsed = sys.windows.length * 2;
  if(sys.ramUsed>sys.ramTotal) sys.ramUsed=sys.ramTotal;
  $("#ramDisplay").innerText = sys.ramUsed;
  if(sys.ramUsed>=16) alert("警告：内存已满，系统卡顿！");
  renderTaskbarWindows();
}
function renderTaskbarWindows(){
  const tb = $("#taskbarApps");
  tb.innerHTML="";
  sys.windows.forEach(w=>{
    tb.innerHTML += `<button onclick="focusWindow(${w.winId})">${w.title}</button>`
  })
}
function initDesktop(){
  sys.desktopItems = [
    {id:1,name:"此电脑",type:"pc",mtime:Date.now()},
    {id:2,name:"回收站",type:"recycle",mtime:Date.now()},
    {id:3,name:"微信",type:"wechat",mtime:Date.now()},
    {id:4,name:"QQ",type:"qq",mtime:Date.now()},
    {id:5,name:"企业微信",type:"wecom",mtime:Date.now()},
    {id:6,name:"飞书",type:"lark",mtime:Date.now()},
    {id:7,name:"浏览器",type:"browser",mtime:Date.now()}
  ];
  sys.selectedIcons=[];
  renderDesktop();
}
function renderDesktop(){
  const d = $("#desktop");
  const box = $("#selectBox");
  d.innerHTML="";
  d.appendChild(box);
  sys.desktopItems.forEach(item=>{
    let svgCode;
    if(item.type==="pc") svgCode = svgIcons.pc;
    else if(item.type==="recycle"){
      svgCode = sys.recycleBin.length>0 ? svgIcons.recycleFull : svgIcons.recycleEmpty;
    }
    else if(item.type==="txt") svgCode = svgIcons.txt;
    else if(item.type==="folder") svgCode = svgIcons.folder;
    else if(item.type==="wechat") svgCode = svgIcons.wechat;
    else if(item.type==="qq") svgCode = svgIcons.qq;
    else if(item.type==="wecom") svgCode = svgIcons.wecom;
    else if(item.type==="lark") svgCode = svgIcons.lark;
    else if(item.type==="browser") svgCode = svgIcons.browser;
    const selClass = sys.selectedIcons.includes(item.id) ? "icon-selected" : "";
    d.innerHTML += `
    <div class="desktop-icon ${selClass}" data-id="${item.id}" ondblclick="openItem('${item.type}',${item.id})" 
    onclick="iconClick(event,${item.id})" oncontextmenu="showFileRightMenu(event,${item.id})">
      <div class="icon-img">${svgCode}</div>
      <div class="icon-name">${item.name}</div>
    </div>`
  })
}
function refreshDesktop(){renderDesktop();hideAllMenu()}
function iconClick(e,id){
  e.stopPropagation();
  if(!e.ctrlKey) sys.selectedIcons=[];
  if(!sys.selectedIcons.includes(id)) sys.selectedIcons.push(id);
  renderDesktop();
}
let boxSel = {active:false,sx:0,sy:0};
function initBoxSelect(){
  const desk = $("#desktop");
  const box = $("#selectBox");
  desk.onmousedown = function(e){
    if(e.target!==desk) return;
    sys.selectedIcons=[];
    renderDesktop();
    boxSel.active=true;
    boxSel.sx=e.offsetX;
    boxSel.sy=e.offsetY;
    box.style.display="block";
    box.style.left = boxSel.sx+"px";
    box.style.top = boxSel.sy+"px";
    box.style.width="0px";
    box.style.height="0px";
  }
  document.onmousemove = function(e){
    if(!boxSel.active) return;
    const rect = desk.getBoundingClientRect();
    const mx = e.clientX - rect.left;
    const my = e.clientY - rect.top;
    const dx = mx - boxSel.sx;
    const dy = my - boxSel.sy;
    box.style.width = Math.abs(dx)+"px";
    box.style.height = Math.abs(dy)+"px";
    box.style.left = dx<0 ? mx : boxSel.sx;
    box.style.top = dy<0 ? my : boxSel.sy;
  }
  document.onmouseup = function(){
    if(boxSel.active){
      boxSel.active=false;
      box.style.display="none";
    }
  }
}
function hideAllMenu(){
  $("#desktopRightMenu").style.display="none";
  $("#fileRightMenu").style.display="none";
}
$("#desktop").addEventListener("contextmenu",e=>{
  e.preventDefault();
  if(!sys.powerOn) return;
  hideAllMenu();
  $("#desktopRightMenu").style.left=e.offsetX+"px";
  $("#desktopRightMenu").style.top=e.offsetY+"px";
  $("#desktopRightMenu").style.display="block";
})
function showFileRightMenu(e,id){
  e.preventDefault();
  e.stopPropagation();
  if(!sys.selectedIcons.includes(id)){
    sys.selectedIcons=[id];
  }
  hideAllMenu();
  $("#fileRightMenu").style.left = e.offsetX + "px";
  $("#fileRightMenu").style.top = e.offsetY + "px";
  $("#fileRightMenu").style.display="block";
}
document.addEventListener("click",hideAllMenu)
function sortByName(){
  sys.desktopItems.sort((a,b)=>a.name.localeCompare(b.name));
  renderDesktop();
}
function sortByDate(){
  sys.desktopItems.sort((a,b)=>b.mtime - a.mtime);
  renderDesktop();
}
function newTxt(){
  const name = prompt("文件名：","新建文档.txt");
  if(!name) return;
  const id = Date.now();
  sys.desktopItems.push({id,name,type:"txt",content:"",mtime:Date.now()});
  renderDesktop();
  hideAllMenu();
}
function newFolder(){
  const name = prompt("文件夹名称：","新建文件夹");
  if(!name) return;
  const id = Date.now();
  sys.desktopItems.push({id,name,type:"folder",files:[],mtime:Date.now()});
  renderDesktop();
  hideAllMenu();
}
function openItem(type,id){
  if(type==="pc") openThisPC();
  if(type==="recycle") openRecycleBin();
  if(type==="txt"){
    const f = sys.desktopItems.find(x=>x.id===id);
    openNotepad(f);
  }
  if(type==="folder"){

// 窗口管理
function createWindow(title,bodyHtml){
  const winId = Date.now();
  sys.windows.push({winId, title});
  updateRAM();
  sys.nextWinZ++;
  const win = document.createElement("div");
  win.className="window";
  win.style.left = 100 + sys.windows.length*25 +"px";
  win.style.top = 60 + sys.windows.length*25 +"px";
  win.style.zIndex = sys.nextWinZ;
  win.dataset.winId = winId;
  win.innerHTML=`
    <div class="window-header" onmousedown="startDrag(event,${winId})" onclick="focusWindow(${winId})">
      <span class="window-title">${title}</span>
      <div class="window-ctrl">
        <button onclick="minWin(${winId})">−</button>
        <button onclick="maxWin(${winId})">□</button>
        <button onclick="closeWin(${winId})">✕</button>
      </div>
    </div>
    <div class="window-body">${bodyHtml}</div>
    <div class="resize-handle" onmousedown="startResize(event,${winId})"></div>
  `;
  $("#win10").append(win);
  return winId;
}
function focusWindow(winId){
  sys.nextWinZ++;
  const allWins = document.querySelectorAll(".window");
  allWins.forEach(w=> w.classList.remove("active"));
  const target = Array.from(allWins).find(w=>w.dataset.winId == winId);
  if(target){
    target.style.zIndex = sys.nextWinZ;
    target.classList.add("active");
    target.style.display="block";
  }
}
let dragData=null;
function startDrag(e,winId){
  focusWindow(winId);
  dragData={winId,ox:e.clientX,oy:e.clientY};
  document.onmousemove=onDrag;
  document.onmouseup=stopDrag;
}
function onDrag(e){
  if(!dragData) return;
  const targetWin = document.querySelector(`.window[data-win-id="${dragData.winId}"]`);
  const dx = e.clientX - dragData.ox;
  const dy = e.clientY - dragData.oy;
  targetWin.style.left = parseInt(targetWin.style.left)+dx+"px";
  targetWin.style.top = parseInt(targetWin.style.top)+dy+"px";
  dragData.ox=e.clientX;dragData.oy=e.clientY;
}
function stopDrag(){dragData=null;document.onmousemove=null;document.onmouseup=null}
let resizeData=null;
function startResize(e,winId){
  e.stopPropagation();
  focusWindow(winId);
  resizeData={winId,ox:e.clientX,oy:e.clientY};
  document.onmousemove=onResize;
  document.onmouseup=stopResize;
}
function onResize(e){
  if(!resizeData) return;
  const targetWin = document.querySelector(`.window[data-win-id="${resizeData.winId}"]`);
  const dw = e.clientX - resizeData.ox;
  const dh = e.clientY - resizeData.oy;
  let w = parseInt(targetWin.style.width)+dw;
  let h = parseInt(targetWin.style.height)+dh;
  if(w>300) targetWin.style.width = w+"px";
  if(h>200) targetWin.style.height = h+"px";
  resizeData.ox=e.clientX;resizeData.oy=e.clientY;
}
function stopResize(){resizeData=null;document.onmousemove=null;document.onmouseup=null}
function closeWin(winId){
  const wins = document.querySelectorAll(".window");
  for(let w of wins){
    if(w.dataset.winId == winId){
      w.remove();break;
    }
  }
  sys.windows = sys.windows.filter(w=>w.winId!==winId);
  updateRAM();
}
function minWin(id){
  const el = document.querySelector(`.window[data-win-id="${id}"]`);
  el.style.display="none";
}
function maxWin(id){
  const el = document.querySelector(`.window[data-win-id="${id}"]`);
  if(el.style.width==="100%"){
    el.style.width="620px";el.style.height="440px";
    el.style.left = 100 + sys.windows.length*25 +"px";
    el.style.top = 60 + sys.windows.length*25 +"px";
  }else{
    el.style.width="100%";el.style.height="calc(100% - 48px)";
    el.style.left="0";el.style.top="0";
  }
}

// 文件右键操作，修复文件夹复制浅拷贝，深度JSON拷贝
function deepClone(obj){
  return JSON.parse(JSON.stringify(obj));
}
function copyFile(){
  if(sys.selectedIcons.length===0){alert("未选中文件");return}
  sys.clipboard = deepClone(sys.selectedIcons.map(id=>sys.desktopItems.find(d=>d.id===id)));
  sys.clipboardOp="copy";
  alert("已复制");
  hideAllMenu();
}
function cutFile(){
  if(sys.selectedIcons.length===0){alert("未选中文件");return}
  sys.clipboard = deepClone(sys.selectedIcons.map(id=>sys.desktopItems.find(d=>d.id===id)));
  sys.clipboardOp="cut";
  alert("已剪切");
  hideAllMenu();
}
function pasteFile(){
  if(!sys.clipboard){alert("剪贴板为空");return}
  sys.clipboard.forEach(f=>{
    const newFile = deepClone(f);
    newFile.id = Date.now()+Math.random();
    newFile.mtime = Date.now();
    if(sys.clipboardOp==="copy") sys.desktopItems.push(newFile);
    if(sys.clipboardOp==="cut"){
      const idx = sys.desktopItems.findIndex(x=>x.id===f.id);
      if(idx>-1) sys.desktopItems[idx]=newFile;
    }
  })
  if(sys.clipboardOp==="cut") sys.clipboard=null;
  renderDesktop();
  alert("粘贴完成");
  hideAllMenu();
}
function delFile(){
  if(sys.selectedIcons.length===0){alert("未选中文件");return}
  sys.selectedIcons.forEach(id=>{
    const f = sys.desktopItems.find(x=>x.id===id);
    if(f.type!=="pc"){
      sys.recycleBin.push(f);
      // 如果是txt文档，释放磁盘空间
      if(f.type === "txt"){
        const encoder = new TextEncoder();
        const byteLen = encoder.encode(f.content).length;
        deleteFileFromDisk(byteLen);
      }
    }
    sys.desktopItems = sys.desktopItems.filter(x=>x.id!==id);
  })
  sys.selectedIcons=[];
  renderDesktop();
  hideAllMenu();
  alert("已移入回收站");
}
function renameItem(){
  if(sys.selectedIcons.length!==1){alert("只能单选重命名");return}
  const f = sys.desktopItems.find(x=>x.id===sys.selectedIcons[0]);
  const newName = prompt("重命名",f.name);

function toggleDrive(driveName){
  const drive = sys.fs.drives.find(d=>d.name===driveName);
  if(drive){
    drive.expanded = !drive.expanded;
    refreshExplorer();
  }
}
function toggleTreeItem(name){
  function findNode(n,target){
    if(n.name === target) return n;
    if(n.children){
      for(let c of n.children){
        const r = findNode(c,target);
        if(r) return r;
      }
    }
    return null;
  }
  const nd = findNode(sys.fs,name);
  if(nd){
    nd.expanded = !nd.expanded;
    refreshExplorer();
  }
}

function refreshExplorer(){
  const treePanel = document.querySelector("#treePanel");
  const fileListPanel = document.querySelector("#fileListPanel");
  const addrBar = document.querySelector(".address-bar");
  if(!treePanel || !fileListPanel) return;

  treePanel.innerHTML = renderTree();
  let fileHtml = "";

  let currentDir;
  if(sys.currentExplorerFolder){
    currentDir = sys.currentExplorerFolder;
    if(addrBar) addrBar.value = "C:\\" + currentDir.name;
    //渲染当前文件夹里面的子项
    if(currentDir.children && currentDir.children.length>0){
      currentDir.children.forEach(child=>{
        if(child.type === "folder"){
          // 可点击进入文件夹
          fileHtml += `<div class="file-item" onclick="enterFolder('${child.name}')">📁 ${child.name}</div>`;
        }else{
          fileHtml += `<div class="file-item">📄 ${child.name}</div>`;
        }
      })
    }else{
      fileHtml += `<div class="file-item">此文件夹为空</div>`;
    }
  }else{
    //根目录：C盘根
    if(addrBar) addrBar.value = "C:\\";
    const cDrive = sys.fs.drives[0];
    cDrive.children.forEach(folder=>{
      //点击右侧文件夹进入
      fileHtml += `<div class="file-item" onclick="enterFolder('${folder.name}')">📁 ${folder.name}</div>`;
    })
    //C盘磁盘项 + 容量条
    const usedBytes = cDrive.totalBytes - cDrive.freeBytes;
    const totalGB = bytesToGB(cDrive.totalBytes);
    const freeGB = bytesToGB(cDrive.freeBytes);
    const percent = (usedBytes / cDrive.totalBytes *100).toFixed(1);
    fileHtml += `
    <div class="file-item">
      <div style="display:flex;align-items:center;gap:10px;">
        <span>💿 ${cDrive.name}</span>
      </div>
      <div style="width:100%;height:22px;background:#ddd;border-radius:3px;margin:4px 0;">
        <div style="width:${percent}%;height:100%;background:#0078d4;border-radius:3px;"></div>
      </div>
      <span>${freeGB.toFixed(1)} GB 可用，共 ${totalGB.toFixed(0)} GB</span>
    </div>
    `;
  }
  fileListPanel.innerHTML = fileHtml;
}

// 保存已有文件
function saveNote(fileId){
  const text = $("#noteText").value;
  const targetFile = sys.desktopItems.find(f=>f.id === fileId);
  const encoder = new TextEncoder();
  const byteLen = encoder.encode(text).length;
  if(targetFile){
    // 更新文件内容，旧空间释放，重新占用
    const oldByteLen = encoder.encode(targetFile.content).length;
    deleteFileFromDisk(oldByteLen);
    if(createFileOnDisk(byteLen)){
      targetFile.content = text;
      targetFile.mtime = Date.now();
      alert("保存成功");
    }
  }else{
    alert("文件不存在，请点另存为");
  }
}

  const text = $("#noteText").value;
  const fn = prompt("另存为文件名：","文档.txt");
  if(!fn) return;
  const id = Date.now();
  const encoder = new TextEncoder();
  const byteLen = encoder.encode(text).length;
  if(createFileOnDisk(byteLen)){
    sys.desktopItems.push({id,name:fn,type:"txt",content:text,mtime:Date.now()});
    renderDesktop();
    alert("另存成功");
  }
}

  const item = sys.recycleBin[idx];
  item.mtime = Date.now();

  if(item.type === "txt"){
    const encoder = new TextEncoder();
    const byteLen = encoder.encode(item.content).length;

  sys.desktopItems.push(item);
  sys.recycleBin.splice(idx,1);
  renderDesktop();
  alert("文件已还原到桌面");

function emptyRecycle(){
  sys.recycleBin.forEach(item=>{

      deleteFileFromDisk(byteLen);

  sys.recycleBin=[];
  renderDesktop();

  $("#browserPage").innerHTML = `<h3>访问：${url}</h3><p>模拟页面加载成功。</p>`;
}
function browserReload(){
  $("#browserPage").innerHTML = `<h3>页面已刷新</h3><p>地址：${sys.browserUrl}</p>`;
}
function browserBack(){
  $("#browserPage").innerHTML = `<p>← 返回上一页（模拟）</p>`;
}
function browserForward(){
  $("#browserPage").innerHTML = `<p>→ 前进下一页（模拟）</p>`;
}

</script>
