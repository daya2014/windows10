<meta charset="UTF-8">
<title>Win10沙盒｜精简修复版</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:"Segoe UI",system-ui,sans-serif;user-select:none}
body{background:#0b0b10;display:flex;justify-content:center;align-items:center;height:100vh;overflow:hidden}
#monitor{width:1100px;height:680px;background:#000;border:14px solid #222;border-radius:16px;overflow:hidden;position:relative}
.screen-off{background:#000 !important}
#win10{width:100%;height:100%;display:none;position:relative;
background: radial-gradient(ellipse at center,#2774c2 0%,#003366 100%);
}
.desktop{width:100%;height:calc(100% - 48px);padding:16px;position:relative}
.desktop-icon{width:84px;text-align:center;cursor:pointer;display:inline-block;margin:10px;vertical-align:top}

.icon-name{font-size:12px;color:#fff;text-shadow:0 0 3px #000, 0 0 6px #000}

.taskbar{position:absolute;bottom:0;width:100%;height:48px;background:rgba(40,40,40,0.92);display:flex;align-items:center;padding:0 12px;z-index:20}

.start-power button{background:#444;border:none;color:#fff;padding:8px 12px;border-radius:4px;margin:4px;cursor:pointer}

.window{position:absolute;width:620px;height:440px;background:#fff;color:#222;border-radius:4px;overflow:hidden;box-shadow:0 4px 24px rgba(0,0,0,0.55);z-index:10;transition:all 0.15s ease}

.tree-panel{width:220px;background:#f3f3f3;padding:8px;overflow:auto}

.tree-item:hover{background:#ddd}

.tree-indent{padding-left:14px}
.file-item{padding:8px;margin:4px;cursor:pointer}

.msg-self .msg-bubble{background:#95ec69}
.msg-other .msg-bubble{background:#e5e5e5}
.browser-wrap{height:100%;display:flex;flex-direction:column}
.browser-topbar{display:flex;gap:4px;padding:6px;background:#eee}
.browser-url{flex:1;padding:4px}
.browser-page{flex:1;background:#fff;padding:10px;overflow:auto}
.rightmenu{position:absolute;background:#fff;border:1px solid #aaa;z-index:9999;display:none}
.rightmenu div{padding:6px 12px;cursor:pointer}

<body>
<div id="monitor">
  <div id="win10">
    <div class="desktop" id="desktop">
      <div class="selection-box" id="selectBox"></div>
    </div>
    <div class="taskbar">
      <button class="start-btn" onclick="toggleStartMenu()">⊞</button>
      <div class="taskbar-apps" id="taskbarApps"></div>
      <div class="tray">
        <span id="clock">00:00</span>
        <span>RAM:<span id="ramDisplay">0</span>/16GB</span>
      </div>
    </div>
    <div class="start-menu" id="startMenu">
      <div class="start-app-item" onclick="openThisPC()">此电脑</div>
      <div class="start-app-item" onclick="openRecycleBin()">回收站</div>
      <div class="start-app-item" onclick="openLark()">飞书</div>
      <div class="start-app-item" onclick="openBrowser()">浏览器</div>
      <div class="start-power">
        <button onclick="shutdown()">关机</button>
        <button onclick="restart()">重启</button>
      </div>
    </div>
    <!--资源管理器右键菜单 -->
    <div class="rightmenu" id="expRightMenu">
      <div onclick="showExplorerProp()">属性</div>
    </div>
  </div>
</div>

<script>
const $ = s=>document.querySelector(s);

// ==========磁盘存储底层｜NTFS 4KB簇模拟 ==========
const CLUSTER_SIZE = 4096;
function bytesToGB(bytes) {
  return bytes / (1024 * 1024 * 1024);
}
function gbToBytes(gb) {
  return gb * 1024 * 1024 * 1024;
}
function getFileDiskOccupiedSize(fileByteSize) {
  if(fileByteSize === 0) return CLUSTER_SIZE;
  const clusterCount = Math.ceil(fileByteSize / CLUSTER_SIZE);
  return clusterCount * CLUSTER_SIZE;
}
const C_TOTAL_BYTES = gbToBytes(112);
let cFreeBytes = gbToBytes(15.1);

function createFileOnDisk(fileByteSize){
  const occupyBytes = getFileDiskOccupiedSize(fileByteSize);
  const cDrive = sys.fs.drives[0];
  if(cDrive.freeBytes >= occupyBytes){
    cDrive.freeBytes -= occupyBytes;
    refreshExplorer();
    return true;
  }else{
    alert("磁盘空间不足！");
    return false;
  }
}
function deleteFileFromDisk(fileByteSize){
  const occupyBytes = getFileDiskOccupiedSize(fileByteSize);
  const cDrive = sys.fs.drives[0];
  cDrive.freeBytes += occupyBytes;
  refreshExplorer();
}

// ==========系统全局数据 ==========
let sys = {
  powerOn:false,
  ramTotal:16,
  ramUsed:0,
  desktopItems:[],
  recycleBin:[],
  windows:[],
  nextWinZ:11,
  selectedIcons:[],
  currentExplorerFolder:null,
  fs:{
    quickAccess:[{name:"桌面",type:"quick"}],
    drives:[
      {
        name:"BOOTCAMP (C:)",
        type:"disk",
        totalBytes:C_TOTAL_BYTES,
        freeBytes:cFreeBytes,
        expanded:false,
        children:[
          {name:"3D 对象",type:"folder",children:[]},
          {name:"视频",type:"folder",children:[]},
          {name:"图片",type:"folder",children:[]},
          {name:"文档",type:"folder",children:[]},
          {name:"下载",type:"folder",children:[]},
          {name:"音乐",type:"folder",children:[]},
          {name:"桌面",type:"folder",children:[]}
        ]
      }
    ]
  },
  larkChats:[
    {name:"项目组",msgList:[{who:"other",text:"文档更新了，请查看"}]},
    {name:"行政",msgList:[{who:"other",text:"打卡提醒"}]}
  ],
  browserUrl:"https://example.com"
};

//SVG图标
const svgIcons = {
pc:`<svg viewBox="0 0 48 48"><rect fill="#0078d4" rx="4" width="48" height="48"/><path fill="#fff" d="M12 16h24v16H12z M16 36h16v4H16z"/></svg>`,
recycleEmpty:`<svg viewBox="0 0 48 48"><rect fill="#4488dd" rx="6" width="48" height="48"/><path fill="#fff" d="M14 12h20v4H14zM16 18h16l-2 20H18z"/></svg>`,
recycleFull:`<svg viewBox="0 0 48 48"><rect fill="#4488dd" rx="6" width="48" height="48"/><path fill="#fff" d="M14 12h20v4H14zM16 18h16l-2 20H18z"/><circle cx="20" cy="26" r="4" fill="#2277dd"/><circle cx="28" cy="26" r="4" fill="#2277dd"/><circle cx="20" cy="34" r="4" fill="#2277dd"/></svg>`,
lark:`<svg viewBox="0 0 48 48"><defs><linearGradient id="lk" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#7149ff"/><stop offset="100%" stop-color="#22b8cf"/></linearGradient></defs><rect fill="url(#lk)" rx="8" width="48" height="48"/><circle fill="#fff" cx="24" cy="24" r="12"/></svg>`,
browser:`<svg viewBox="0 0 48 48"><circle fill="#ffffff" cx="24" cy="24" r="22"/><circle stroke="#4285f4" stroke-width="3" cx="24" cy="24" r="16"/><circle fill="#4285f4" cx="24" cy="24" r="8" /></svg>`
};

// ==========开机关机重启【已修复按钮失效】 ==========
$("#monitor").onclick = function(){
  if(!sys.powerOn){
    sys.powerOn=true;
    $("#win10").style.display="block";
    $("#monitor").classList.remove("screen-off");
    initDesktop();
    startClock();
    updateRAM();
  }
}
function shutdown(){
  sys.powerOn = false;
  $("#win10").style.display = "none";
  $("#startMenu").style.display = "none";
  document.querySelectorAll(".window").forEach(w=>w.remove());
  sys.windows = [];
  updateRAM();
}
function restart(){
  shutdown();
  setTimeout(()=>{
    sys.powerOn = true;
    $("#win10").style.display = "block";
    initDesktop();
    startClock();
    updateRAM();
  },1000);
}


function toggleStartMenu(){
  const sm = $("#startMenu");
  sm.style.display = sm.style.display==="block" ? "none":"block";
}
document.addEventListener("click",(e)=>{
  const sm = $("#startMenu");
  const btn = document.querySelector(".start-btn");
  if(sm.style.display==="block" && !sm.contains(e.target) && !btn.contains(e.target)){
    sm.style.display="none";
  }
})
// 阻止菜单内部点击冒泡，保证关机按钮能触发
document.querySelector("#startMenu").addEventListener("click",e=>{
  e.stopPropagation();
})


function startClock(){
  setInterval(()=>{
    const d = new Date();
    $("#clock").innerText = d.toLocaleTimeString();
  },1000)
}
function updateRAM(){
  sys.ramUsed = sys.windows.length * 2;
  if(sys.ramUsed>sys.ramTotal) sys.ramUsed=sys.ramTotal;
  $("#ramDisplay").innerText = sys.ramUsed;
  renderTaskbarWindows();
}
function renderTaskbarWindows(){
  const tb = $("#taskbarApps");
  tb.innerHTML="";
  sys.windows.forEach(w=>{
    tb.innerHTML += `<button onclick="focusWindow(${w.winId})">${w.title}</button>`
  })
}

// ==========桌面渲染【修复appendChild报错】 ==========
function initDesktop(){
  sys.desktopItems = [
    {id:1,name:"此电脑",type:"pc",mtime:Date.now()},
    {id:2,name:"回收站",type:"recycle",mtime:Date.now()},
    {id:3,name:"飞书",type:"lark",mtime:Date.now()},
    {id:4,name:"浏览器",type:"browser",mtime:Date.now()}
  ];
  sys.selectedIcons=[];
  renderDesktop();
}
function renderDesktop(){
  const d = $("#desktop");
  const box = $("#selectBox");
  d.innerHTML="";
  d.appendChild(box);

  sys.desktopItems.forEach(item=>{
    let svgCode;
    if(item.type==="pc") svgCode = svgIcons.pc;
    else if(item.type==="recycle") svgCode = sys.recycleBin.length>0 ? svgIcons.recycleFull : svgIcons.recycleEmpty;
    else if(item.type==="lark") svgCode = svgIcons.lark;
    else if(item.type==="browser") svgCode = svgIcons.browser;

    const div = document.createElement('div');
    div.className="desktop-icon";
    div.ondblclick = function(){ openItem(item.type); };
    div.innerHTML = `
      <div class="icon-img">${svgCode}</div>
      <div class="icon-name">${item.name}</div>
    `;
    d.appendChild(div);
  })
}
function openItem(type){
  if(type==="pc") openThisPC();
  if(type==="recycle") openRecycleBin();
  if(type==="lark") openLark();
  if(type==="browser") openBrowser();
}

// ==========窗口系统 ==========
function createWindow(title,bodyHtml){
  const winId = Date.now();
  sys.windows.push({winId, title});
  updateRAM();
  sys.nextWinZ++;
  const win = document.createElement("div");
  win.className="window";
  win.style.left = 100 + sys.windows.length*25 +"px";
  win.style.top = 60 + sys.windows.length*25 +"px";
  win.style.zIndex = sys.nextWinZ;
  win.dataset.winId = winId;
  win.innerHTML=`
    <div class="window-header" onmousedown="startDrag(event,${winId})" onclick="focusWindow(${winId})">
      <span class="window-title">${title}</span>
      <div class="window-ctrl">
        <button onclick="minWin(${winId})">−</button>
        <button onclick="maxWin(${winId})">□</button>
        <button onclick="closeWin(${winId})">✕</button>
      </div>
    </div>
    <div class="window-body">${bodyHtml}</div>
    <div class="resize-handle" onmousedown="startResize(event,${winId})"></div>
  `;
  $("#win10").append(win);
  return winId;
}
function focusWindow(winId){
  sys.nextWinZ++;
  document.querySelectorAll(".window").forEach(w=>w.classList.remove("active"));
  const target = Array.from(document.querySelectorAll(".window")).find(w=>w.dataset.winId == winId);
  if(target){ target.style.zIndex=sys.nextWinZ; target.classList.add("active"); target.style.display="block"; }
}
let dragData=null;
function startDrag(e,winId){focusWindow(winId);dragData={winId,ox:e.clientX,oy:e.clientY};document.onmousemove=onDrag;document.onmouseup=stopDrag;}
function onDrag(e){
  if(!dragData)return;
  const w = document.querySelector(`.window[data-win-id="${dragData.winId}"]`);
  const dx=e.clientX-dragData.ox; const dy=e.clientY-dragData.oy;
  w.style.left = parseInt(w.style.left)+dx+"px";
  w.style.top = parseInt(w.style.top)+dy+"px";
  dragData.ox=e.clientX; dragData.oy=e.clientY;
}
function stopDrag(){dragData=null;document.onmousemove=null;document.onmouseup=null;}
let resizeData=null;
function startResize(e,winId){focusWindow(winId);resizeData={winId,ox:e.clientX,oy:e.clientY};document.onmousemove=onResize;document.onmouseup=stopResize;}
function onResize(e){
  if(!resizeData)return;
  const w = document.querySelector(`.window[data-win-id="${resizeData.winId}"]`);
  const dw=e.clientX-resizeData.ox; const dh=e.clientY-resizeData.oy;
  let wi = parseInt(w.style.width)+dw;
  let hi = parseInt(w.style.height)+dh;
  if(wi>300) w.style.width = wi+"px";
  if(hi>200) w.style.height = hi+"px";
  resizeData.ox=e.clientX; resizeData.oy=e.clientY;
}
function stopResize(){resizeData=null;document.onmousemove=null;document.onmouseup=null;}
function closeWin(winId){
  document.querySelectorAll(".window").forEach(w=>{if(w.dataset.winId==winId) w.remove();});
  sys.windows = sys.windows.filter(x=>x.winId!==winId);
  updateRAM();
}
function minWin(id){document.querySelector(`.window[data-win-id="${id}"]`).style.display="none";}
function maxWin(id){
  const el = document.querySelector(`.window[data-win-id="${id}"]`);
  if(el.style.width==="100%"){
    el.style.width="620px";el.style.height="440px";
    el.style.left=100+sys.windows.length*25+"px";
    el.style.top=60+sys.windows.length*25+"px";
  }else{
    el.style.width="100%";el.style.height="calc(100% - 48px)";
    el.style.left="0";el.style.top="0";
  }
}

// ==========此电脑【修复：返回根、C盘容量计算】 ==========
function goPcRoot(){
  sys.currentExplorerFolder = null;
  refreshExplorer();
}

function getCChildFolder(folderName) {
  const cDrive = sys.fs.drives[0];
  return cDrive.children.find(f => f.name === folderName);
}
function enterFolder(folderName) {
  const folderObj = getCChildFolder(folderName);
  if (!folderObj) return;
  sys.currentExplorerFolder = folderObj;
  refreshExplorer();
}
function renderTree(){
  let html="";
  html += `<div class="tree-item tree-fold">★ 快速访问</div>`;
  html += `<div class="tree-item tree-fold">💻 此电脑</div>`;
  sys.fs.drives.forEach(d=>{
    let arrow = d.expanded ? "▼":"▶";
    html += `<div class="tree-item tree-indent" onclick="toggleDrive('${d.name}')">${arrow} 💿 ${d.name}</div>`;
    if(d.expanded){
      d.children.forEach(child=>{
        html += `<div class="tree-item tree-indent" onclick="enterFolder('${child.name}')">📁 ${child.name}</div>`;
      })
    }
  })
  return html;
}
function toggleDrive(driveName){
  const d = sys.fs.drives.find(x=>x.name===driveName);
  if(d){d.expanded=!d.expanded; refreshExplorer();}
}
let explorerWinId=null;
function openThisPC(){
  explorerWinId = createWindow("此电脑",`
    <div class="explorer-wrap">
      <div style="display:flex;gap:4px;padding:4px">
        <button onclick="goPcRoot()">←此电脑</button>
        <input class="address-bar" value="C:\\" readonly style="flex:1">
      </div>
      <div class="explorer-main">
        <div class="tree-panel" id="treePanel"></div>
        <div class="file-list-panel" id="fileListPanel"></div>
      </div>
    </div>
  `);
  sys.currentExplorerFolder=null;
  refreshExplorer();
}

function bindFileListRightMenu(){
  const panel = document.querySelector("#fileListPanel");
  const menu = $("#expRightMenu");
  if(!panel || !menu) return;
  panel.oncontextmenu = function(e){
    e.preventDefault(); //阻止浏览器原生右键菜单
    menu.style.left = e.offsetX +"px";
    menu.style.top = e.offsetY +"px";
    menu.style.display = "block";
  }
  //点击页面空白关闭自定义右键菜单
  document.addEventListener("click",()=>{
    menu.style.display="none";
  })
}

function showExplorerProp(){
  $("#expRightMenu").style.display="none";
  alert("资源管理器属性\n簇大小：4KB(4096字节)\n模拟NTFS文件系统");
}

function refreshExplorer(){
  const tree = document.querySelector("#treePanel");
  const list = document.querySelector("#fileListPanel");
  if(!tree||!list) return;
  tree.innerHTML = renderTree();
  let html="";
  if(sys.currentExplorerFolder){
    const dir = sys.currentExplorerFolder;
    if(dir.children.length>0){
      dir.children.forEach(c=>{
        if(c.type==="folder") html += `<div class="file-item" onclick="enterFolder('${c.name}')">📁 ${c.name}</div>`;
        else html += `<div class="file-item">📄 ${c.name}</div>`;
      })
    }else{
      html += `<div class="file-item">此文件夹为空</div>`;
    }
  }else{
    const cDrive = sys.fs.drives[0];
    cDrive.children.forEach(f=>{
      html += `<div class="file-item" onclick="enterFolder('${f.name}')">📁 ${f.name}</div>`;
    })
    const usedBytes = cDrive.totalBytes - cDrive.freeBytes;
    const totalGB = (cDrive.totalBytes / (1024*1024*1024)).toFixed(2);
    const freeGB = (cDrive.freeBytes / (1024*1024*1024)).toFixed(2);
    const usedGB = (usedBytes / (1024*1024*1024)).toFixed(2);
    const pct = ((usedBytes/cDrive.totalBytes)*100).toFixed(1);
    html += `
    <div class="file-item">
      <div style="display:flex;align-items:center;gap:10px;"><span>💿 ${cDrive.name}</span></div>
      <div style="width:100%;height:22px;background:#ddd;border-radius:3px;margin:4px 0;">
        <div style="width:${pct}%;height:100%;background:#0078d4;border-radius:3px;"></div>
      </div>
      <span>已用 ${usedGB} GB，${freeGB} GB 可用，总容量 ${totalGB} GB</span>
    </div>`;
  }
  list.innerHTML = html;
  bindFileListRightMenu();
}

// ==========回收站 ==========
function openRecycleBin(){
  let html=`<p>回收站项目数量：${sys.recycleBin.length}</p>`;
  sys.recycleBin.forEach((item,i)=>{
    html += `<div>${item.name} <button onclick="restoreItem(${i})">还原</button></div>`;
  })
  html += `<br><button onclick="emptyRecycle()">清空回收站</button>`;
  createWindow("回收站",html);
}
function restoreItem(idx){
  const item = sys.recycleBin[idx];
  item.mtime = Date.now();
  if(item.type==="txt"){
    const enc = new TextEncoder();
    const len = enc.encode(item.content).length;
    createFileOnDisk(len);
  }
  sys.desktopItems.push(item);
  sys.recycleBin.splice(idx,1);
  renderDesktop();
  alert("已还原到桌面");
}
function emptyRecycle(){
  sys.recycleBin.forEach(item=>{
    if(item.type==="txt"){
      const enc = new TextEncoder();
      const len = enc.encode(item.content).length;
      deleteFileFromDisk(len);
    }
  })
  sys.recycleBin=[];
  renderDesktop();
  alert("回收站已清空");
}

// ==========飞书 ==========
function openLark(){
  let contactHtml = "";
  sys.larkChats.forEach((c,idx)=>{
    contactHtml += `<div class="im-contact-item" onclick="renderLarkChat(${idx})">${c.name}</div>`
  })
  createWindow("飞书",`
    <div class="im-container">
      <div class="im-sidebar">${contactHtml}</div>
      <div class="im-chat-area">
        <div class="im-chat-content" id="larkChatBox"></div>
        <div class="im-input-area">
          <textarea id="larkInput"></textarea>
          <br>
          <button onclick="sendLarkMsg()">发送</button>
        </div>
      </div>
    </div>
  `)
  renderLarkChat(0);
}
function renderLarkChat(idx){
  const chat = sys.larkChats[idx];
  let msgHtml = "";
  chat.msgList.forEach(m=>{
    msgHtml += `<div class="msg-${m.who}"><span class="msg-bubble">${m.text}</span></div>`
  })
  $("#larkChatBox").innerHTML = msgHtml;
  $("#larkChatBox").scrollTop = $("#larkChatBox").scrollHeight;
  window.larkCurrentChatIdx = idx;
}
function sendLarkMsg(){
  const txt = $("#larkInput").value.trim();
  if(!txt) return;
  sys.larkChats[window.larkCurrentChatIdx].msgList.push({who:"self",text:txt});
  $("#larkInput").value="";
  renderLarkChat(window.larkCurrentChatIdx);
}

// ==========浏览器 ==========
function openBrowser(){
  createWindow("浏览器",`
    <div class="browser-wrap">
      <div class="browser-topbar">
        <button onclick="browserBack()">←</button>
        <button onclick="browserForward()">→</button>
        <button onclick="browserReload()">↻</button>
        <input class="browser-url" id="browserUrl" value="${sys.browserUrl}"/>
        <button onclick="browserGo()">前往</button>
      </div>
      <div class="browser-page" id="browserPage">
        <h3>模拟浏览器</h3>
        <p>仅本地模拟，不访问互联网</p>
      </div>
    </div>
  `)
}
function browserGo(){
  const url = $("#browserUrl").value;
  sys.browserUrl = url;
  $("#browserPage").innerHTML = `<h3>访问：${url}</h3><p>模拟页面加载成功。</p>`;
}
function browserReload(){
  $("#browserPage").innerHTML = `<h3>页面已刷新</h3><p>地址：${sys.browserUrl}</p>`;
}
function browserBack(){ $("#browserPage").innerHTML=`<p>← 返回上一页（模拟）</p>`; }
function browserForward(){ $("#browserPage").innerHTML=`<p>→ 前进下一页（模拟）</p>`; }
</script>
